name: Codacy Analysis And Coverage

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-open-pr:
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - name: Check for open PR from branch
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push' || context.ref === 'refs/heads/main') {
              core.setOutput('has_open_pr', 'false');
              return;
            }

            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
            });

            core.setOutput('has_open_pr', data.length > 0 ? 'true' : 'false');

  codacy:
    needs: check-open-pr
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.check-open-pr.outputs.has_open_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run test:coverage -- --run

      - name: Generate backend coverage
        working-directory: backend
        run: ./mvnw clean verify
        env:
          # Evita el fallo de ApplicationContext inyectando H2
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: 

      - name: Run Codacy Analysis Scan
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: frontend/coverage/lcov.info,backend/target/site/jacoco/jacoco.xml