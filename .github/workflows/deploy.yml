name: Deploy To Render

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_STATIC_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STATIC_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Render backend deploy
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Skipping Render backend deploy because RENDER_DEPLOY_HOOK_URL is not configured."
            exit 0
          fi

          echo "Triggering Render backend deploy..."
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo
          echo "Render backend deploy hook accepted."

      - name: Trigger Render Static deploy
        shell: bash
        run: |
          if [ -z "$RENDER_STATIC_DEPLOY_HOOK_URL" ]; then
            echo "Skipping Render Static deploy because RENDER_STATIC_DEPLOY_HOOK_URL is not configured."
            exit 0
          fi

          echo "Triggering Render static deploy..."
          curl --fail --silent --show-error --request POST "$RENDER_STATIC_DEPLOY_HOOK_URL"
          echo
          echo "Render static deploy hook accepted."
