name: Lint & Style Check

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-open-pr:
    runs-on: ubuntu-latest
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - name: Check for open PR from branch
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push' || context.ref === 'refs/heads/main') {
              core.setOutput('has_open_pr', 'false');
              return;
            }

            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`
            });

            core.setOutput('has_open_pr', data.length > 0 ? 'true' : 'false');

  lint:
    needs: check-open-pr
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.check-open-pr.outputs.has_open_pr != 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- JAVA STYLE ---
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Checkstyle
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw checkstyle:check

      # --- NODE STYLE ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install & Lint Frontend
        run: |
          cd frontend
          npm ci
          npx eslint . --ext .ts,.tsx
          npx prettier --check .